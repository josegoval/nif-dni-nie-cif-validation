version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Match `minimumReleaseAge` in pnpm-workspace.yaml (3 days): pnpm refuses
    # to install anything newer, so a PR for it would fail. Security updates
    # are not delayed by the cooldown.
    cooldown:
      default-days: 3
    commit-message:
      prefix: build
      include: scope
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    # @types/node follows the oldest Node.js the package supports (engines:
    # >=20, the Compat job), not the newest: types of a newer major would let
    # code use APIs that Node 20 doesn't have. Move it to a new major by hand
    # when the engines floor moves.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # The website (website/) is its own pnpm workspace with its own lockfile and
  # the same 3-day `minimumReleaseAge`. Its `nif-dni-nie-cif-validation:
  # link:..` dependency points at the repository root, which Dependabot can
  # read, so it needs no special handling. All its dependencies are grouped:
  # the site is not published to npm, so a site dependency's type says nothing
  # about who is affected.
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    commit-message:
      prefix: build
      include: scope
    groups:
      website:
        patterns: ["*"]
        update-types: [minor, patch]
    # Same rule as the root: @types/node moves to a new major by hand.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # examples/ is deliberately not here. Every example depends on
  # `nif-dni-nie-cif-validation: file:../.pack/package`, the unpacked tarball
  # that `pnpm examples:pack` writes and that .gitignore keeps out of the
  # repository (the examples must run against what npm ships, not src/).
  # Dependabot resolves path dependencies from the files in the repository, so
  # it cannot find that folder and every update job would fail. Update the
  # examples by hand instead; see "Update their dependencies" in
  # examples/README.md.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]
