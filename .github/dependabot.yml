version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Match `minimumReleaseAge` in pnpm-workspace.yaml (3 days): pnpm refuses
    # to install anything newer, so a PR for it would fail. Security updates
    # are not delayed by the cooldown.
    cooldown:
      default-days: 3
    commit-message:
      prefix: build
      include: scope
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]
