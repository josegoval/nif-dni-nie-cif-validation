# One pipeline for CI and releases. The filename must stay `release.yml`:
# npm Trusted Publishing is bound to it on npmjs.com.
name: CI

on:
  push:
    branches: [master, next, next-major, beta, alpha]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on a release branch mid-publish; cancel stale PR runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HUSKY: "0" # do not install git hooks in CI

jobs:
  check:
    name: Check (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so commitlint can walk the PR's commits. (Don't use
          # `cond && 0 || 1`: expressions treat 0 as false.)
          fetch-depth: 0
      - name: Setup pnpm
        # Version comes from `packageManager` in package.json.
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Fails on high or critical advisories in the dependency tree. Moderate
      # and low ones are visible with `pnpm audit` but do not block a PR.
      - name: Audit dependencies
        run: pnpm audit --audit-level high
      - name: Lint commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
      - name: Lint (Biome)
        run: pnpm lint
      # Words cspell doesn't know go in .cspell/project-words.txt.
      - name: Spell check (cspell)
        run: pnpm spell
      # Every rule ID in src/ and the tests exists in SPEC.md, and every SPEC
      # rule has a test (scripts/check-spec-rules.mjs).
      - name: Check SPEC rule IDs
        run: pnpm spec:check
      # The numbers in README.md and README.es.md are written from
      # bench/results/latest.json by `pnpm readme:bench`; fail if they drift.
      - name: Check the README sections generated from the benchmark
        run: pnpm readme:bench --check
      # llms-full.txt is assembled from the README and the docs by
      # `pnpm docs:llms`; fail if it is out of date with them.
      - name: Check llms-full.txt
        run: pnpm docs:llms --check
      - name: Typecheck
        run: pnpm typecheck
      - name: Test with coverage (100% enforced)
        run: pnpm test
      # Coverage stays inside GitHub: a table in the job summary and the
      # HTML report as a downloadable artifact. No third-party service.
      # Also runs when the coverage threshold fails, but only if tests ran.
      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        run: node scripts/coverage-summary.mjs
      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/html/
          retention-days: 14
      # Builds dist/ and fails if a bundle is over its budget in
      # .size-limit.json (a boolean validator must not pull in the messages).
      - name: Bundle size budgets (size-limit)
        run: pnpm size
      # Every export of every entry point has JSDoc in dist/*.d.mts and
      # dist/*.d.cts: a summary, @param, @returns, two @example, @see and
      # @since (scripts/check-jsdoc.mjs). The examples are run by the tests.
      - name: Check the JSDoc of every export
        run: node scripts/check-jsdoc.mjs
      # Fails if dist/ has syntax or built-ins newer than ES2016, so the
      # package runs in browsers without transpiling.
      - name: Check the ES target (es-check)
        run: pnpm check:es
      # `prepack` builds dist/. Pack into a separate folder so script output
      # (e.g. Husky's "skip install" notice) can't corrupt the filename.
      - name: Pack
        id: pack
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          pnpm pack --pack-destination "$RUNNER_TEMP/pack" > /dev/null
          echo "tarball=$(ls "$RUNNER_TEMP"/pack/*.tgz)" >> "$GITHUB_OUTPUT"
      # The `compat` job installs this exact tarball on the oldest Node.
      - name: Upload package tarball
        uses: actions/upload-artifact@v7
        with:
          name: package-tarball
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7
      # Bundles each core import from the tarball with esbuild and fails if a
      # boolean validator has the error messages or organisation names, or if
      # any core import has the generators, an adapter or a schema library.
      - name: Check tree shaking
        run: node scripts/check-tree-shaking.mjs "${{ steps.pack.outputs.tarball }}"
      # Runs the /zod, /valibot and /yup adapters of the tarball, from import
      # and from require, against the schema libraries of the dev dependencies.
      # (The smoke tests have no dependencies, so they can't cover this.)
      - name: Check the schema adapters
        run: node scripts/check-adapters.mjs "${{ steps.pack.outputs.tarball }}"
      - name: Lint package with publint
        run: pnpm dlx publint run "${{ steps.pack.outputs.tarball }}" --strict
      # Fails unless the types resolve in node10, node16 (CJS and ESM) and
      # bundler modes.
      - name: Check types with attw
        run: pnpm dlx @arethetypeswrong/cli "${{ steps.pack.outputs.tarball }}"

  # Smoke test of the packed tarball on the oldest supported Node (the
  # `engines.node` floor in package.json). Consumers never run our dev
  # tooling, so this job installs no dev dependencies and no pnpm: it installs
  # the tarball that `check` packed into an empty folder and runs a plain
  # `node:test` file against it, once with `require()` and once with `import`.
  compat:
    name: Compat (Node 20)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: test/smoke # only the smoke tests are needed
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Download package tarball
        uses: actions/download-artifact@v8
        with:
          name: package-tarball
          path: ${{ runner.temp }}/pack
      - name: Install the tarball and smoke test it
        run: |
          smoke="$RUNNER_TEMP/smoke"
          mkdir -p "$smoke"
          cd "$smoke"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP"/pack/*.tgz
          cp "$GITHUB_WORKSPACE/test/smoke/smoke.test.cjs" .
          cp "$GITHUB_WORKSPACE/test/smoke/smoke.test.mjs" .
          node --version
          node --test smoke.test.cjs smoke.test.mjs

  release:
    name: Release
    if: github.event_name == 'push'
    # RELEASE_DEPLOY_KEY is an environment secret, and the environment only
    # accepts the release branches, so no other branch's workflow can read it.
    environment: release
    needs: [check, compat]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # publish the GitHub release, push the release commit and tag
      issues: write # comment on released issues
      pull-requests: write # comment on released pull requests
      id-token: write # npm Trusted Publishing (OIDC) and provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # The "Protect master" ruleset requires passing checks, which the
          # release commit pushed by semantic-release can't have. That push
          # goes through this write deploy key, which the ruleset lets
          # bypass. GitHub releases and comments still use GITHUB_TOKEN.
          # The secret lives in the `release` environment, not the repo.
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - name: Setup pnpm
        # Version comes from `packageManager` in package.json.
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # semantic-release 25 needs Node ^22.22.2 || >=24.15; Node 24 also
          # bundles an npm new enough for Trusted Publishing.
          node-version: "24"
          cache: pnpm
      - name: Check npm supports Trusted Publishing (>= 11.5.1)
        run: |
          npm --version
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number);process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$(npm --version)" \
            || { echo "::error::npm >= 11.5.1 is required for npm Trusted Publishing"; exit 1; }
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Tests already passed in `check` and `compat` for this commit.
      - name: Build package
        run: pnpm build
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NPM_TOKEN: @semantic-release/npm authenticates through OIDC.
          NPM_CONFIG_PROVENANCE: "true"
        run: pnpm exec semantic-release
