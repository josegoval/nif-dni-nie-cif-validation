name: Test package

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: "0" # do not install git hooks in CI

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn
      # --ignore-engines: the release tooling (semantic-release 25 and its
      # plugins) needs Node >= 22.22, but the package itself is tested on
      # Node 20 too. Only the release job runs semantic-release.
      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-engines
      - name: Typecheck
        run: yarn typecheck
      - name: Test with coverage
        run: yarn test --coverage
      - name: Build
        run: yarn build
      # Coverage stays inside GitHub: a table in the job summary and the
      # HTML report as a downloadable artifact. No third-party service.
      - name: Coverage summary
        if: matrix.node-version == 24
        run: node scripts/coverage-summary.mjs
      - name: Upload coverage report
        if: matrix.node-version == 24
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/lcov-report/
          retention-days: 14

  package:
    name: Package (publint, attw)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      # `prepack` builds dist/ before the tarball is created.
      - name: Pack
        id: pack
        run: echo "tarball=$(npm pack --silent | tail -n 1)" >> "$GITHUB_OUTPUT"
      - name: Lint package with publint
        run: npx --yes publint run "${{ steps.pack.outputs.tarball }}" --strict
      # The package is CJS-only until the dual ESM/CJS build lands (#48).
      # attw reports no problems today. If it ever flags a rule that only
      # #48 can fix (for example FalseESM or CJSResolvesToESM), add it with
      # `--ignore-rules <rule>` and a comment referencing #48.
      - name: Check types with attw
        run: npx --yes @arethetypeswrong/cli "${{ steps.pack.outputs.tarball }}"
