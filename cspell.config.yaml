# Spell check for source, tests, scripts, examples, docs and CI (`pnpm spell`).
# Unknown words that are real (Spanish legal terms, domain terms, tool names)
# go in .cspell/project-words.txt, one per line.
version: "0.2"
# The docs use British spelling ("behaviour", "organisation").
language: en,en-GB
files:
  - "src/**"
  - "scripts/**"
  - "test/**"
  - "bench/**"
  - "examples/**"
  - "*.md"
  - "llms.txt"
  - "llms-full.txt"
  - "docs/**"
  - "*.json"
  - "*.yaml"
  - "*.mjs"
  - "*.mts"
  - ".github/**"
  # The website's English text and code (its own workspace: nothing here
  # needs its dependencies). The other languages get a language review.
  - "website/*.{md,mjs,ts,json,yaml}"
  - "website/{src,scripts,integrations,tests}/**"
ignorePaths:
  - node_modules/**
  - dist/**
  - coverage/**
  - pnpm-lock.yaml
  # The examples: their own lockfile, installed packages, build output, the
  # package unpacked for them and the generated sample CSV.
  - examples/pnpm-lock.yaml
  - examples/**/node_modules/**
  - examples/**/dist/**
  - examples/.pack/**
  - examples/**/*.csv
  # The website: its lockfile, installed packages, build output, and the
  # pages and texts in Spanish, Catalan, Basque and Galician.
  - website/pnpm-lock.yaml
  - website/node_modules/**
  - website/dist/**
  - website/.astro/**
  - website/src/content/docs/{es,ca,eu,gl}/**
  - website/src/content/i18n/**
  - website/src/i18n/{es,ca,eu,gl}.ts
  # Generated by semantic-release from commit messages.
  - CHANGELOG.md
  - .github/badges/**
# The Spanish dictionary (Spain), used only by the overrides below.
import:
  - "@cspell/dict-es-es/cspell-ext.json"
dictionaryDefinitions:
  - name: project-words
    path: ./.cspell/project-words.txt
    addWords: true
dictionaries:
  - project-words
ignoreRegExpList:
  # Test inputs made of non-ASCII look-alikes, for example "ıſßñ".
  - NonAsciiRun
patterns:
  - name: NonAsciiRun
    pattern: /[^\x00-\x7F]{3,}/g
overrides:
  # The texts of the Catalan, Basque and Galician locales, and the marker
  # strings the tree-shaking check looks for: the project has no dictionary
  # for these languages, and a language review checks the locales
  # (docs/translations.md). Comments are still spell-checked.
  - filename: "{src/locales/{ca,eu,gl}.ts,scripts/check-tree-shaking.mjs}"
    ignoreRegExpList:
      - string
  # The Spanish README, and the script that writes its generated parts, are
  # checked in Spanish and English: their prose is in both, their code and
  # identifiers in English.
  - filename: "{README.es.md,scripts/readme-bench.mjs}"
    language: en,en-GB,es,es-ES
  # The example form and the sample CSV are in Spanish (the language of the
  # messages they show, and of the names in the file).
  - filename: "{examples/zod-react-hook-form/src/**,examples/csv-bulk-validation/generate-sample.mjs}"
    language: en,en-GB,es,es-ES
