# pnpm settings. Since pnpm 11 they live here, not in package.json or .npmrc.

# Supply chain: only install versions that have been on the registry for at
# least 3 days (in minutes), so a compromised release is caught and pulled
# before we can install it. Applies to transitive dependencies too.
minimumReleaseAge: 4320

# Supply chain: dependency install scripts are blocked unless listed here.
# `strictDepBuilds` (default) fails the install if a new dependency ships an
# unreviewed install script. Only list packages that really need to build.
#
# esbuild (size-limit's bundler and the tree-shaking check) is reviewed and
# denied: its postinstall only swaps the JS launcher for the native binary as a
# start-up optimisation and checks the platform package. esbuild works without
# it, from the platform package that pnpm installs as an optional dependency.
allowBuilds:
  esbuild: false

# Exception to minimumReleaseAge for one exact version: v1.0.11 of this very
# package, installed as the `nif-v1` dev alias. The differential test and the
# benchmark compare the current code against it. It is our own release (built
# from this repository by the release workflow with provenance), so the
# waiting period protects nothing here. Pinned to the exact version so no
# other release of the package skips the check. Can be removed once 1.0.11 is
# older than 3 days.
minimumReleaseAgeExclude:
  - nif-dni-nie-cif-validation@1.0.11

# `pnpm audit` findings that were reviewed and accepted. Each needs a reason
# and is removed as soon as a fixed version exists.
auditConfig:
  ignoreGhsas:
    # braces <= 3.0.3: a stack overflow on deeply nested brace patterns
    # (CVE-2026-93687), with no fixed version yet. braces is only reached
    # through development tools (globbing in semantic-release, es-check, the
    # build and test tooling), which expand the repository's own patterns,
    # never input from users, and the published package has no dependencies.
    - GHSA-vfj7-8cjw-p6xm
